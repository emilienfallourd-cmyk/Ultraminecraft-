<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1b1b">
<title>UltraMinecraft</title>
<meta name="description" content="Un Minecraft réaliste en Three.js : rendu PBR, ombres, eau à réflexions par lancer de rayons, rayons volumétriques, trois dimensions, créatures et boss.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- ATH (affichage tête haute) -->
  <div id="hud" class="hidden">
    <div id="bossbars"></div>
    <div id="crosshair"></div>
    <div id="title"><div id="titleMain"></div><div id="titleSub"></div></div>
    <div id="chatlog"></div>
    <div id="actionbar"></div>
    <div id="bottom">
      <div id="stats">
        <div id="leftStats"><div id="armor" class="row"></div><div id="hearts" class="row"></div></div>
        <div id="rightStats"><div id="air" class="row rtl"></div><div id="food" class="row rtl"></div></div>
      </div>
      <div id="xpbar"><div id="xpfill"></div><div id="xplevel"></div></div>
      <div id="hotbar"></div>
    </div>
    <div id="debug" class="hidden"></div>
    <div id="toasts"></div>
  </div>

  <!-- écrans d'inventaire -->
  <div id="screen" class="hidden">
    <div id="screenPanel" class="panel"></div>
    <div id="cursorItem" class="slot floating"></div>
    <div id="tooltip" class="hidden"></div>
  </div>

  <!-- discussion / commandes -->
  <div id="chat" class="hidden"><input id="chatInput" type="text" autocomplete="off" spellcheck="false" maxlength="256"></div>

  <!-- menus -->
  <div id="menu"></div>

  <!-- chargement -->
  <div id="loading" class="hidden"><div class="ltext">Génération du terrain…</div><div class="lbar"><div class="lfill"></div></div><div class="ltip"></div></div>

  <!-- commandes tactiles -->
  <div id="touch">
    <div id="tMove" class="tpad"><div class="tknob"></div></div>
    <div id="tLook" class="tpad look"><i></i><i></i><i></i><i></i><div class="tknob"></div></div>
    <div class="tbtn" id="tJump"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg></div>
    <div class="tbtn" id="tSneak"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></div>
    <div class="tbtn small" id="tPause"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></div>
    <div id="tHold"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16"/></svg></div>
  </div>

  <noscript><div class="nojs">UltraMinecraft nécessite JavaScript et WebGL 2.</div></noscript>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
